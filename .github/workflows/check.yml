name: "ALLSTARS | Verificar integridade"
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Conferir scripts, dados e histórico
        run: python engine/check.py
      - name: Testar geracao de capa
        run: |
          python -m pip install "Pillow>=10.4,<12"
          python engine/cover.py --episode data/episode.json --output output/capa.png
          test -s output/capa.png
