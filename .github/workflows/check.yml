name: "ALLSTARS | Verificar integridade"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: allstars-check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar sintaxe do backend seguro
        run: npm run test:syntax
      - name: Testar login e geração sem utilizar tokens reais
        run: node --test tests/backend.test.js
      - name: Testar notificações e consentimento do navegador
        run: |
          node --check public/notify.js
          node --test tests/notify.test.js
      - name: Validar JavaScript do painel web
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('public/index.html').read_text(encoding='utf-8')
          script=html.split('<script type="module">',1)[1].split('</script>',1)[0]
          Path('/tmp/allstars-ui.mjs').write_text(script,encoding='utf-8')
          PY
          node --check /tmp/allstars-ui.mjs
      - name: Verificar menu mobile acessível e botão de avisos no topo
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('public/index.html').read_text(encoding='utf-8')
          assert html.count('id="notify-enable"')==1
          assert html.count('id="mobile-menu-toggle"')==1
          assert html.count('id="studio-nav-links"')==1
          assert html.index('id="alert-settings"')<html.index('<section class="hero">')
          assert 'aria-controls="studio-nav-links"' in html
          assert 'aria-expanded="false"' in html
          assert 'if(event.key===\'Escape\'' in html
          assert 'if(event.target.closest(\'a\'))closeMobileMenu()' in html
          assert '.section-nav-links.is-open{display:flex}' in html
          print('Menu e notificações no topo: estrutura e acessibilidade OK')
          PY
      - name: Testar revisão da capa, pesquisa complementar e prévias de arquivo
        run: |
          node --check api/art.js
          node --check api/file-preview.js
          node --test tests/art-editorial.test.js
          node --check api/art-upload.js
          node --test tests/image-import.test.js
          node --check lib/visual-storage.js
          node --check api/visual-library.js
          node --check api/visual-review.js
          node --test tests/visual-library.test.js
          python -m py_compile engine/visual_sync.py
          python -m py_compile engine/art_gate.py engine/source_adaptation.py engine/import_art.py engine/external_prompt.py engine/scene_direction.py engine/narrative_league.py engine/brand_assets.py engine/anime_briefing.py engine/cover.py engine/poster.py
          python -m unittest discover -s tests -p 'test_source_adaptation.py' -v
      - name: Conferir separação entre prévia, aprovação e produção final
        run: |
          python - <<'PY'
          from pathlib import Path
          preview=Path('.github/workflows/art-preview.yml').read_text()
          produce=Path('.github/workflows/produce.yml').read_text()
          frontend=Path('public/index.html').read_text()
          assert 'types: [opened]' in preview
          assert 'ALLSTARS_ART_CHANGE' in preview
          assert 'gh release create' in preview and '--prerelease' in preview
          assert "startsWith(github.event.comment.body, 'ALLSTARS_ART_APPROVE')" in produce
          assert 'issues:\n    types: [opened]' not in produce
          assert 'python engine/art_gate.py approve' in produce
          assert 'gh release download' in produce
          for control in ('art-review','art-revise','art-regenerate','art-approve',
                          'file-preview-copy','image-preview-dialog','external-image-prompt',
                          'external-image-drop','external-image-file','external-image-send'):
              assert 'id="'+control+'"' in frontend, control
          assert 'python engine/external_prompt.py' in preview
          assert 'python engine/import_art.py' in preview
          assert 'prompt_imagem_ia.txt#prompt_imagem_ia.txt' in preview
          assert 'gh release download "preview-issue-' in produce
          assert 'python engine/visual_sync.py --stage preview' in preview
          assert 'python engine/visual_sync.py --stage published' in produce
          assert 'id="visual-archive"' in frontend
          assert 'id="visual-origin"' in frontend
          print('Prévia visual obrigatória, decisão editorial e reutilização de capa aprovada: OK')
          PY
      - name: Compilar sintaxe Python dos módulos de produção por link
        run: |
          python -m py_compile engine/from_link.py engine/request_select.py engine/article_extract.py engine/editorial_guard.py engine/content_request.py engine/topic_generate.py
      - name: Testar recuperação de páginas lentas sem Gemini
        run: python -m unittest discover -s tests -p 'test_link_timeout.py' -v
      - name: Validar colagem extensa de fontes
        run: python -m unittest discover -s tests -p 'test_reference_batch.py' -v
      - name: Validar extração de matérias e preservação de fontes
        run: python -m unittest discover -s tests -p 'test_article_extract.py' -v
      - name: Validar tipo de conteúdo e temas coletivos
        run: python -m unittest discover -s tests -p 'test_content_modes.py' -v
      - name: Validar consistência histórica dos roteiros por link
        run: python -m unittest discover -s tests -p 'test_editorial_guard.py' -v
      - name: Conferir scripts, dados e histórico
        run: python engine/check.py
      - name: Conferir fontes de pesquisa
        run: |
          python engine/research.py --episode data/episode.json --output output/pesquisa.json
          python -c "import json; d=json.load(open('output/pesquisa.json')); assert len(d['research_sites']) == 4"
      - name: Instalar Pillow para validar a identidade visual
        run: python -m pip install "Pillow>=10.4,<12"
      - name: Validar aprovação de arte com Pillow instalado
        run: python -m unittest discover -s tests -p 'test_art_gate.py' -v
      - name: Validar upload de imagem, cortes 9:16/3:4 e prompt externo
        run: python -m unittest discover -s tests -p 'test_external_image.py' -v
      - name: Validar arquivo Supabase e memória editorial sem credenciais
        run: python -m unittest discover -s tests -p 'test_visual_sync.py' -v
      - name: Testar arte contextual única, nova a cada execução
        run: python -m unittest discover -s tests -p 'test_original_art.py' -v
      - name: Verificar Rube Foster, arte importada e logo ALLSTARS
        run: python -m unittest discover -s tests -p 'test_contextual_composition.py' -v
      - name: Verificar que artes anime só pertencem ao atleta aprovado
        run: python -m unittest discover -s tests -p 'test_anime_assets.py' -v
      - name: Confirmar imagem anime Jim Abbott aprovada e vinculada ao no-hitter
        run: python -m unittest discover -s tests -p 'test_approved_jim.py' -v
      - name: Validar layout 9:16, legendas e arte cartoon sem foto
        run: python -m unittest discover -s tests -p 'test_visual_layout.py' -v
      - name: Testar seleção segura de imagens Commons
        run: python -m unittest discover -s tests -p 'test_commons_media.py' -v
      - name: Verificar logo original preservada
        run: |
          python - <<'PY'
          import base64,io
          from PIL import Image
          from pathlib import Path
          data=base64.b64decode(Path("brand/logo.b64").read_text().strip(),validate=True)
          im=Image.open(io.BytesIO(data));im.verify()
          print("Logo oficial íntegra:",len(data),"bytes")
          PY
      - name: Testar geracao de capa
        run: |
          python engine/cover.py --episode data/episode.json --output output/capa.png
          test -s output/capa.png
          test -s output/capa_perfil_3x4.png
      - name: Instalar FFmpeg para teste de vídeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Conferir legendas e Reel com audio de teste (sem chamadas de API)
        run: |
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i anullsrc=r=22050:cl=mono -t 8 -c:a pcm_s16le output/test-audio.wav
          python - <<'PY'
          import json
          from pathlib import Path
          ep=json.loads(Path('data/episode.json').read_text())
          ep['screens']=ep['screens'][:2]
          Path('output/test-episode.json').write_text(json.dumps(ep,ensure_ascii=False))
          PY
          python engine/subtitles.py --episode output/test-episode.json --audio output/test-audio.wav --out-dir output
          python engine/render.py --episode output/test-episode.json --audio output/test-audio.wav --out-dir output
          test -s output/allstars_reel.mp4
          test -s output/legendas.srt
          ffprobe -v error output/allstars_reel.mp4 >/dev/null
      - name: Testar capa e vídeo de episódio novo com arte contextual inédita
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ep=json.loads(Path("data/episode.json").read_text(encoding="utf-8"))
          ep["id"]="teste-art-ep"
          ep["episode_number"]=987654
          ep["unique_art_required"]=True
          ep["subject"]="No-hitter histórico 1993"
          ep["title"]="A história do no-hitter"
          ep["hook"]="Como um jogo sem rebatidas entrou para a história?"
          ep["art_direction"]="Arremessador, zona de strike, cronologia e bola"
          Path("output/new-art-episode.json").write_text(json.dumps(ep,ensure_ascii=False),encoding="utf-8")
          PY
          python engine/cover.py --episode output/new-art-episode.json --output output/new-art-cover.png
          python engine/visual_quality.py --episode output/new-art-episode.json --output output/new-art-quality.json
          python engine/render.py --episode output/new-art-episode.json --audio output/test-audio.wav --out-dir output/new-art
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("output/new-art-quality.json").read_text(encoding="utf-8"))
          st=json.loads(Path("output/new-art/storyboard.json").read_text(encoding="utf-8"))
          assert q["new_for_episode"] is True and q["premium"] is False,q
          assert st["hook_window_seconds"]==3 and st["scenes"],st
          assert Path("output/new-art-cover.png").stat().st_size>30000
          assert Path("output/new-art/allstars_reel.mp4").stat().st_size>30000
          PY
          ffprobe -v error output/new-art/allstars_reel.mp4 >/dev/null
      - name: Testar Reel com imagem aprovada Jim Abbott sem Gemini e sem API paga
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ep={
            "athlete":"Jim Abbott",
            "episode_number":9,
            "title":"1993: O NO-HITTER DE JIM ABBOTT",
            "cover_headline":"NASCIDO SEM A MÃO DIREITA. LANÇOU UM NO-HITTER.",
            "narration":"Em 1993, Jim Abbott lançou um no-hitter. Um feito marcante do beisebol.",
            "screens":["UMA NOITE HISTÓRICA","UM NO-HITTER INESQUECÍVEL"],
            "caption":"Uma história de superação no beisebol",
            "sources":["https://www.mlb.com/players"]
          }
          Path("output/test-jim-abbott.json").write_text(json.dumps(ep,ensure_ascii=False),encoding="utf-8")
          PY
          python engine/commons_media.py --episode output/test-jim-abbott.json --output output/midia.json
          python engine/visual_quality.py --episode output/test-jim-abbott.json --output output/qualidade_visual.json
          python engine/cover.py --episode output/test-jim-abbott.json --output output/capa.png
          python engine/subtitles.py --episode output/test-jim-abbott.json --audio output/test-audio.wav --out-dir output
          python engine/render.py --episode output/test-jim-abbott.json --audio output/test-audio.wav --out-dir output
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          media=json.loads(Path("output/midia.json").read_text(encoding="utf-8"))
          quality=json.loads(Path("output/qualidade_visual.json").read_text(encoding="utf-8"))
          assert media["status"]=="approved_anime",media
          assert quality["mode"]=="anime_aprovado",quality
          assert quality["premium"] is True,quality
          assert Image.open("output/capa.png").size==(1080,1920)
          assert Image.open("output/capa_perfil_3x4.png").size==(1080,1440)
          assert Path("output/allstars_reel.mp4").stat().st_size>30000
          assert "Arte anime original aprovada" in Path("output/legenda_instagram.txt").read_text(encoding="utf-8")
          print("PASSOU: imagem aprovada, marca e MP4 com legendas.")
          PY
          ffprobe -v error output/allstars_reel.mp4 >/dev/null
      - name: Montar prévia anime com a narração original do episódio Jim Abbott
        run: |
          curl --fail --location --retry 2 --silent --show-error \
            https://github.com/liuhelpme/allstars-studio/releases/download/episodio-9/narracao.mp3 \
            --output output/narracao-jim-original.mp3
          curl --fail --location --retry 2 --silent --show-error \
            https://github.com/liuhelpme/allstars-studio/releases/download/episodio-9/roteiro.txt \
            --output output/roteiro-jim-original.txt
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("output/test-jim-abbott.json")
          ep=json.loads(path.read_text(encoding="utf-8"))
          ep["narration"]=Path("output/roteiro-jim-original.txt").read_text(encoding="utf-8")
          path.write_text(json.dumps(ep,ensure_ascii=False),encoding="utf-8")
          PY
          python engine/subtitles.py --episode output/test-jim-abbott.json --audio output/narracao-jim-original.mp3 --out-dir output
          python engine/render.py --episode output/test-jim-abbott.json --audio output/narracao-jim-original.mp3 --out-dir output
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 output/allstars_reel.mp4
          test -s output/allstars_reel.mp4
          cp output/allstars_reel.mp4 output/jim_abbott_anime_preview.mp4
      - name: Disponibilizar prévia visual do teste
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: allstars-previa-visual-${{ github.run_number }}
          path: |
            output/capa.png
            output/capa_perfil_3x4.png
            output/qualidade_visual.json
            output/midia.json
            output/allstars_reel.mp4
            output/jim_abbott_anime_preview.mp4
            output/legendas.srt
            output/legendas_metadata.json
          retention-days: 3
