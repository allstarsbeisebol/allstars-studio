name: "ALLSTARS | Verificar integridade"
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar sintaxe do backend seguro
        run: npm run test:syntax
      - name: Testar login e geração sem utilizar tokens reais
        run: node --test tests/backend.test.js
      - name: Testar notificações e consentimento do navegador
        run: |
          node --check public/notify.js
          node --test tests/notify.test.js
      - name: Validar JavaScript do painel web
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('public/index.html').read_text(encoding='utf-8')
          script=html.split('<script type="module">',1)[1].split('</script>',1)[0]
          Path('/tmp/allstars-ui.mjs').write_text(script,encoding='utf-8')
          PY
          node --check /tmp/allstars-ui.mjs
      - name: Compilar sintaxe Python dos módulos de produção por link
        run: |
          python -m py_compile engine/from_link.py engine/request_select.py engine/article_extract.py engine/editorial_guard.py
      - name: Validar extração de matérias e preservação de fontes
        run: python -m unittest discover -s tests -p 'test_article_extract.py' -v
      - name: Validar consistência histórica dos roteiros por link
        run: python -m unittest discover -s tests -p 'test_editorial_guard.py' -v
      - name: Conferir scripts, dados e histórico
        run: python engine/check.py
      - name: Conferir fontes de pesquisa
        run: |
          python engine/research.py --episode data/episode.json --output output/pesquisa.json
          python -c "import json; d=json.load(open('output/pesquisa.json')); assert len(d['research_sites']) == 4"
      - name: Instalar Pillow para validar a identidade visual
        run: python -m pip install "Pillow>=10.4,<12"
      - name: Validar layout 9:16, legendas e arte cartoon sem foto
        run: python -m unittest discover -s tests -p 'test_visual_layout.py' -v
      - name: Testar seleção segura de imagens Commons
        run: python -m unittest discover -s tests -p 'test_commons_media.py' -v
      - name: Verificar logo original preservada
        run: |
          python - <<'PY'
          import base64,io
          from PIL import Image
          from pathlib import Path
          data=base64.b64decode(Path("brand/logo.b64").read_text().strip(),validate=True)
          im=Image.open(io.BytesIO(data));im.verify()
          print("Logo oficial íntegra:",len(data),"bytes")
          PY
      - name: Testar geracao de capa
        run: |
          python engine/cover.py --episode data/episode.json --output output/capa.png
          test -s output/capa.png
          test -s output/capa_perfil_3x4.png
      - name: Instalar FFmpeg para teste de vídeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Conferir legendas e Reel com audio de teste (sem chamadas de API)
        run: |
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i anullsrc=r=22050:cl=mono -t 8 -c:a pcm_s16le output/test-audio.wav
          python - <<'PY'
          import json
          from pathlib import Path
          ep=json.loads(Path('data/episode.json').read_text())
          ep['screens']=ep['screens'][:2]
          Path('output/test-episode.json').write_text(json.dumps(ep,ensure_ascii=False))
          PY
          python engine/subtitles.py --episode output/test-episode.json --audio output/test-audio.wav --out-dir output
          python engine/render.py --episode output/test-episode.json --audio output/test-audio.wav --out-dir output
          test -s output/allstars_reel.mp4
          test -s output/legendas.srt
          ffprobe -v error output/allstars_reel.mp4 >/dev/null
      - name: Disponibilizar prévia visual do teste
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: allstars-previa-visual-${{ github.run_number }}
          path: |
            output/capa.png
            output/allstars_reel.mp4
            output/legendas.srt
            output/legendas_metadata.json
          retention-days: 3
