name: "ALLSTARS | Novo rascunho semanal"
on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"
permissions:
  contents: write
concurrency:
  group: allstars-editorial
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Criar novo rascunho sem API paga
        run: python engine/generate.py
      - name: Salvar rascunho e histórico no repositório
        run: |
          git config user.name "allstars-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/drafts/
          git commit -m "content: novo rascunho editorial" || echo "Nenhum novo rascunho"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: allstars-rascunhos
          path: data/drafts/
          retention-days: 30
