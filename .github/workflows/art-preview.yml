name: "ALLSTARS | Preparar e revisar capa"
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
concurrency:
  group: allstars-issue-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  art-preview:
    if: |
      (github.event_name == 'issues' &&
       contains(fromJSON('["liuhelpme","allstarsbeisebol"]'), github.event.issue.user.login) &&
       startsWith(github.event.issue.title, '[ALLSTARS] Criar novo episódio')) ||
      (github.event_name == 'issue_comment' &&
       contains(fromJSON('["liuhelpme","allstarsbeisebol"]'), github.event.comment.user.login) &&
       contains(fromJSON('["liuhelpme","allstarsbeisebol"]'), github.event.issue.user.login) &&
       startsWith(github.event.issue.title, '[ALLSTARS] Criar novo episódio') &&
       startsWith(github.event.comment.body, 'ALLSTARS_ART_CHANGE'))
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      ISSUE_ID: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Criar roteiro ou recuperar versão para ajuste
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          ALLSTARS_ISSUE_ID: ${{ github.event.issue.number }}
        run: |
          mkdir -p output
          if [ "${{ github.event_name }}" = "issues" ]; then
            python engine/request_select.py
            python engine/art_gate.py prepare
          else
            gh release download "preview-issue-${ISSUE_ID}" --repo "${{ github.repository }}" \
              --pattern selected.json --dir output --clobber
            python engine/art_gate.py revise
          fi
      - name: Consultar referências visuais aprovadas no Supabase
        env:
          SUPABASE_URL: https://alrgqmwnynybawenyugb.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python engine/visual_sync.py --stage memory --out output/style_memory.json || echo "Memória indisponível; prompt será criado normalmente."
      - name: Instalar somente o necessário para preparar a imagem
        run: |
          python -m pip install 'Pillow>=10.4,<12'
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          sudo install -d /usr/share/fonts/truetype/barlow
          sudo curl --retry 2 -fLsS https://raw.githubusercontent.com/google/fonts/main/ofl/barlowcondensed/BarlowCondensed-ExtraBold.ttf -o /usr/share/fonts/truetype/barlow/BarlowCondensed-ExtraBold.ttf || true
          sudo curl --retry 2 -fLsS https://raw.githubusercontent.com/google/fonts/main/ofl/barlow/Barlow-Bold.ttf -o /usr/share/fonts/truetype/barlow/Barlow-Bold.ttf || true
          fc-cache -f || true
      - name: Preparar logo oficial nítida do site ALLSTARS
        run: python engine/brand_assets.py
      - name: Criar imagem para aprovação antes do vídeo
        run: |
          python engine/visual_quality.py --episode output/selected.json --output output/qualidade_visual.json
          python engine/anime_briefing.py --episode output/selected.json --output output/briefing_arte_anime.txt
          python engine/external_prompt.py --episode output/selected.json --output output/prompt_imagem_ia.txt
          asset="$(python -c 'import json; print(json.load(open("output/selected.json")).get("art_image_asset",""))')"
          if [ -n "$asset" ]; then
            gh release download "preview-issue-${ISSUE_ID}" --repo "${{ github.repository }}" \
              --pattern "$asset" --dir output --clobber
            python engine/import_art.py --episode output/selected.json \
              --image "output/$asset" --output output/capa.png
          else
            python engine/cover.py --episode output/selected.json --output output/capa.png
          fi
      - name: Arquivar capa e prompt na biblioteca privada do Supabase
        env:
          SUPABASE_URL: https://alrgqmwnynybawenyugb.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python engine/visual_sync.py --stage preview || echo "Arquivo GitHub permanece disponível; confira a sincronização do Supabase."
      - name: Publicar capa e roteiro no espaço de revisão do pedido
        run: |
          set -eu
          tag="preview-issue-${ISSUE_ID}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" \
              output/selected.json#selected.json \
              output/capa.png#capa.png \
              output/capa_perfil_3x4.png#capa_perfil_3x4.png \
              output/logo-oficial.png#logo-oficial.png \
              output/briefing_arte_anime.txt#briefing_arte_anime.txt \
              output/prompt_imagem_ia.txt#prompt_imagem_ia.txt \
              output/qualidade_visual.json#qualidade_visual.json \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create "$tag" \
              output/selected.json#selected.json \
              output/capa.png#capa.png \
              output/capa_perfil_3x4.png#capa_perfil_3x4.png \
              output/briefing_arte_anime.txt#briefing_arte_anime.txt \
              output/prompt_imagem_ia.txt#prompt_imagem_ia.txt \
              output/qualidade_visual.json#qualidade_visual.json \
              --repo "${{ github.repository }}" \
              --title "ALLSTARS · Prévia da capa · pedido #${ISSUE_ID}" \
              --notes "Etapa de prévia; não é vídeo final. Imagem contextual inédita, sujeito a aprovação editorial." \
              --prerelease --latest=false
          fi
          revision="$(python -c 'import json; print(json.load(open("output/selected.json"))["art_revision"])')"
          gh issue comment "$ISSUE_ID" --repo "${{ github.repository }}" \
             --body "ALLSTARS_ART_READY REVISION=${revision} TAG=${tag}"
      - name: Informar erro na etapa visual sem iniciar o vídeo
        if: failure()
        run: |
          set +e
          if [ -s output/production_failure.txt ]; then
            reason=$(head -c 210 output/production_failure.txt)
          else
            reason="A prévia da capa não pôde ser preparada. Veja os detalhes da execução."
          fi
          gh issue comment "$ISSUE_ID" --repo "${{ github.repository }}" \
             --body "ALLSTARS_ART_FAILED: ${reason} Registro: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ github.event_name }}" = "issues" ]; then
            gh issue close "$ISSUE_ID" --repo "${{ github.repository }}" --reason "not planned"
          fi
