name: "ALLSTARS | Produzir vídeo"
on:
  workflow_dispatch:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
concurrency:
  group: allstars-issue-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false
jobs:
  full-episode:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       contains(fromJSON('["liuhelpme","allstarsbeisebol"]'), github.event.comment.user.login) &&
       contains(fromJSON('["liuhelpme","allstarsbeisebol"]'), github.event.issue.user.login) &&
       startsWith(github.event.issue.title, '[ALLSTARS] Criar novo episódio') &&
       startsWith(github.event.comment.body, 'ALLSTARS_ART_APPROVE'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Selecionar história ou preparar episódio baseado em link
        if: github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          python engine/request_select.py
      - name: Recuperar roteiro e imagem da versão aprovada
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_ID: ${{ github.event.issue.number }}
        run: |
          mkdir -p output
          gh release download "preview-issue-${ISSUE_ID}" --repo "${{ github.repository }}" \
            --pattern selected.json --pattern capa.png --pattern capa_perfil_3x4.png \
            --dir output --clobber
          python engine/art_gate.py approve
          asset="$(python -c 'import json; print(json.load(open("output/selected.json")).get("art_image_asset",""))')"
          if [ -n "$asset" ]; then
            gh release download "preview-issue-${ISSUE_ID}" --repo "${{ github.repository }}" \
              --pattern "$asset" --dir output --clobber
          fi
      - name: Instalar programas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Disponibilizar fontes Barlow oficiais para a arte
        run: |
          sudo install -d /usr/share/fonts/truetype/barlow
          sudo curl --retry 2 -fLsS https://raw.githubusercontent.com/google/fonts/main/ofl/barlowcondensed/BarlowCondensed-ExtraBold.ttf -o /usr/share/fonts/truetype/barlow/BarlowCondensed-ExtraBold.ttf || true
          sudo curl --retry 2 -fLsS https://raw.githubusercontent.com/google/fonts/main/ofl/barlow/Barlow-Bold.ttf -o /usr/share/fonts/truetype/barlow/Barlow-Bold.ttf || true
          fc-cache -f || true
      - name: Baixar voz pt-BR
        run: python -m piper.download_voices pt_BR-faber-medium --data-dir voice
      - name: Registrar identificador técnico de produção
        if: github.event_name == 'workflow_dispatch'
        env:
          EPISODE_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path("output/selected.json")
          episode=json.loads(path.read_text(encoding="utf-8"))
          episode["episode_number"]=int(os.environ["EPISODE_NUMBER"])
          path.write_text(json.dumps(episode,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - name: Procurar fotografia com licença e crédito explícitos
        run: python engine/commons_media.py --episode output/selected.json --output output/midia.json
      - name: Preparar referências para pesquisa
        run: python engine/research.py --episode output/selected.json --output output/pesquisa.json
      - name: Classificar qualidade visual do episódio
        run: python engine/visual_quality.py --episode output/selected.json --output output/qualidade_visual.json
      - name: Preparar direção anime para a história selecionada
        run: python engine/anime_briefing.py --episode output/selected.json --output output/briefing_arte_anime.txt
      - name: Criar capa oficial do vídeo
        if: github.event_name == 'workflow_dispatch'
        run: python engine/cover.py --episode output/selected.json --output output/capa.png
      - name: Gerar narração brasileira pausada
        run: python engine/speech.py --episode output/selected.json --model pt_BR-faber-medium --data-dir voice --output output/narracao.wav --pace 1.14
      - name: Preparar alinhamento local das legendas (CPU)
        run: python -m pip install -q 'faster-whisper>=1.1,<2' || echo 'Whisper nao disponivel; fallback temporal habilitado'
      - name: Legendar e montar Reel cinematografico
        env:
          ALLSTARS_WHISPER: '1'
        run: |
          python engine/subtitles.py --episode output/selected.json --audio output/narracao.wav --out-dir output
          python engine/render.py --episode output/selected.json --audio output/narracao.wav
          ffmpeg -y -loglevel error -i output/narracao.wav -codec:a libmp3lame -qscale:a 3 output/narracao.mp3
      - name: Copia de seguranca
        uses: actions/upload-artifact@v4
        with:
          name: allstars-producao-${{ github.run_number }}
          path: |
            output/capa.png
            output/capa_perfil_3x4.png
            output/allstars_reel.mp4
            output/narracao.mp3
            output/legenda_instagram.txt
            output/roteiro.txt
            output/fontes.txt
            output/pesquisa.json
            output/midia.json
            output/briefing_arte_anime.txt
            output/qualidade_visual.json
            output/storyboard.json
            output/legendas.srt
            output/legendas_metadata.json
          retention-days: 30
      - name: Publicar links para download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: episodio-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" \
            output/capa.png#capa.png \
            output/capa_perfil_3x4.png#capa_perfil_3x4.png \
            output/allstars_reel.mp4#allstars_reel.mp4 \
            output/narracao.mp3#narracao.mp3 \
            output/legenda_instagram.txt#legenda_instagram.txt \
            output/roteiro.txt#roteiro.txt \
            output/fontes.txt#fontes.txt \
            output/pesquisa.json#pesquisa.json \
            output/midia.json#midia.json \
            output/briefing_arte_anime.txt#briefing_arte_anime.txt \
            output/qualidade_visual.json#qualidade_visual.json \
            output/storyboard.json#storyboard.json \
            output/legendas.srt#legendas.srt \
            output/legendas_metadata.json#legendas_metadata.json \
            --repo "${{ github.repository }}" \
            --title "$(python -c 'import json; episode=json.load(open("output/selected.json")); print("ALLSTARS | "+str(episode.get("title") or episode.get("subject") or "Vídeo")[:110])')" \
            --notes "PREVIA EDITORIAL: confira fontes, narracao e direitos de uso antes de postar." \
            --latest
      - name: Confirmar capa usada no vídeo na biblioteca Supabase
        env:
          SUPABASE_URL: https://alrgqmwnynybawenyugb.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python engine/visual_sync.py --stage published || echo "Reel disponível; sincronização visual pendente."
      - name: Atualizar downloads do site
        env:
          RELEASE_TAG: episodio-${{ github.run_number }}
        run: |
          python engine/publish_manifest.py
          git config user.name "allstars-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json public/latest.json data/history.json data/drafts/
          git commit -m "content: episodio disponivel para download" || true
          git push

      - name: Informar falha do pedido sem gerar conteúdo errado
        if: failure() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s output/production_failure.txt ]; then
            reason=$(head -c 360 output/production_failure.txt)
          else
            reason="Falha na geração do áudio, da imagem ou do vídeo. Consulte o registro técnico."
          fi
          printf 'Não foi possível gerar este episódio. Motivo: %s. O pedido não foi substituído por outra história. Registro: https://github.com/%s/actions/runs/%s' "$reason" "${{ github.repository }}" "${{ github.run_id }}" > /tmp/allstars-production-failure-message.txt
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/allstars-production-failure-message.txt
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason "not planned"

      - name: Registrar resultado no pedido iniciado pelo site
        if: success() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Vídeo gerado. Baixe pelo site https://allstars-studio-brown.vercel.app/#downloads ou consulte https://github.com/allstarsbeisebol/allstars-studio/releases/tag/episodio-${{ github.run_number }}. Prévia editorial: confira os fatos e direitos antes da publicação."
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
